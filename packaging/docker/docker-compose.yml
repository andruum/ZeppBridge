# Private HTTP MCP service plus one-shot sync/status commands.
#
# `docker compose up -d` starts the authenticated HTTP MCP endpoint and the
# private sync runner used by Coolify's scheduled tasks.
# Local one-shot sync uses the `sync` profile. On Coolify, scheduled tasks run
# inside an already-running container, so target `zepp-sync-runner` instead.
# Do not publish port 8080 unless you intentionally configure a trusted TLS
# reverse proxy and restrict access. `expose` only makes it reachable to other
# containers on this Compose network.

x-common: &common
  image: zeppbridge:local
  build:
    context: ../..
    dockerfile: packaging/docker/Dockerfile
  volumes:
    - zeppbridge-data:/data
  restart: "no"

services:
  # Incremental sync. Give the app token and account metadata only to this
  # container; the MCP service never needs Zepp cloud credentials.
  sync:
    <<: *common
    profiles: ["sync"]
    command: ["zeppbridge-cli", "sync", "--mode", "incremental", "--json"]
    environment:
      ZEPPBRIDGE_DATA_DIR: /data
      ZEPPBRIDGE_CREDENTIAL_STORE: env
      ZEPPBRIDGE_APP_TOKEN: "${ZEPPBRIDGE_APP_TOKEN-}"
      ZEPPBRIDGE_USER_ID: "${ZEPPBRIDGE_USER_ID-}"
      ZEPPBRIDGE_REGION_HOST: "${ZEPPBRIDGE_REGION_HOST-}"
      TZ: "${TZ:-UTC}"

  # Coolify scheduled tasks execute inside an already-running container. Keep a
  # dedicated, credential-bearing runner alive so sync never needs secrets in
  # the HTTP MCP service; Coolify invokes zeppbridge-cli inside this container.
  zepp-sync-runner:
    <<: *common
    command: ["sleep", "infinity"]
    environment:
      ZEPPBRIDGE_DATA_DIR: /data
      ZEPPBRIDGE_CREDENTIAL_STORE: env
      ZEPPBRIDGE_APP_TOKEN: "${ZEPPBRIDGE_APP_TOKEN-}"
      ZEPPBRIDGE_USER_ID: "${ZEPPBRIDGE_USER_ID-}"
      ZEPPBRIDGE_REGION_HOST: "${ZEPPBRIDGE_REGION_HOST-}"
      TZ: "${TZ:-UTC}"
    restart: unless-stopped

  status:
    <<: *common
    profiles: ["status"]
    command: ["zeppbridge-cli", "status", "--json"]
    environment:
      ZEPPBRIDGE_DATA_DIR: /data
      ZEPPBRIDGE_CREDENTIAL_STORE: env
      ZEPPBRIDGE_APP_TOKEN: "${ZEPPBRIDGE_APP_TOKEN-}"
      ZEPPBRIDGE_USER_ID: "${ZEPPBRIDGE_USER_ID-}"
      ZEPPBRIDGE_REGION_HOST: "${ZEPPBRIDGE_REGION_HOST-}"
      TZ: "${TZ:-UTC}"

  # Existing local MCP client transport (stdio), retained for backwards compatibility.
  mcp:
    <<: *common
    profiles: ["mcp"]
    command: ["zeppbridge-mcp"]
    stdin_open: true
    tty: false
    environment:
      ZEPPBRIDGE_DATA_DIR: /data
      TZ: "${TZ:-UTC}"

  # Default long-running service. It has no Zepp credentials, only a separate
  # bearer token used by MCP clients. No host port is published by this file.
  zepp-mcp-http:
    <<: *common
    command: ["zeppbridge-mcp", "--http"]
    environment:
      ZEPPBRIDGE_DATA_DIR: /data
      ZEPPBRIDGE_MCP_HTTP_ADDR: "0.0.0.0:8080"
      ZEPPBRIDGE_MCP_AUTH_TOKEN: "${ZEPPBRIDGE_MCP_AUTH_TOKEN:?set ZEPPBRIDGE_MCP_AUTH_TOKEN}"
      TZ: "${TZ:-UTC}"
    expose:
      - "8080"
    networks:
      - zeppbridge-mcp-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  zeppbridge-data:
    name: "${COMPOSE_PROJECT_NAME:-zeppbridge}_data"

networks:
  zeppbridge-mcp-net:
    name: zeppbridge-mcp-net
    driver: bridge
    internal: true
