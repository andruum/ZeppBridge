[package]
name = "zeppbridge-mcp"
version = "2.4.3"
description = "ZeppBridge read-only MCP server: stdio and authenticated HTTP"
edition = "2021"

[[bin]]
name = "zeppbridge-mcp"
path = "src/main.rs"

[dependencies]
zeppbridge-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
axum = "0.8"
tokio = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
